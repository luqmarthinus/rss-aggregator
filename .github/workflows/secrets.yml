name: Secret scan

# Scans the full git history with gitleaks on every push and pull request.
# Known false positives are pinned by fingerprint in .gitleaksignore.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  gitleaks:
    name: Scan for secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # Full history, so a secret committed and later deleted is still found.
          fetch-depth: 0
      # Runs the MIT-licensed gitleaks binary rather than gitleaks-action, so no
      # third-party action gets a token. The checksum pins the exact file.
      # Dependabot can't update this: check https://github.com/gitleaks/gitleaks/releases
      # now and then, and copy the new linux_x64 line from that release's checksums file.
      - name: Install gitleaks
        env:
          VERSION: 8.30.1
          SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          file="gitleaks_${VERSION}_linux_x64.tar.gz"
          curl --silent --show-error --fail --location --output "$RUNNER_TEMP/$file" "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/${file}"
          echo "${SHA256}  $RUNNER_TEMP/$file" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$file" -C "$RUNNER_TEMP" gitleaks
      # --redact keeps any secret found out of the public CI log.
      - name: Scan history
        run: '"$RUNNER_TEMP/gitleaks" git --redact --no-banner --verbose .'
